<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goblin's Crypt</title>
    <link rel="stylesheet" href="./css/gamestyle.css">
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <script src="./js/app.js" defer></script>
</head>
<body>
    <a href="./html/gameInstructions.html">Game Instructions</a>

    <main class="container">
        <div id="charcterAction" class="display">
            <h3 id="charName">Character Name</h3>

            <div id="playerCharacter">
                <div id="playerSprite" class="characterSprite"></div>
            </div>
            
            <div class="bottomSection">
                <p>HP: <span id="charHP"></span></p>
                
                <div class="btnContainer">
                    <button id="charAttackSkill">
                        Attack Skill
                    </button>
                    
                    <button id="charPowerUp">
                        Power Up
                    </button>
                    
                    <button id="charPotion">
                        Healing Potion
                    </button>
                </div>
            </div>
        </div>
        
        <div id="monsterAction" class="display">
            <h3 id="monsterName"></h3>

            <div id="monsterCharacter">
                <div id="monsterSprite" class="characterSprite"></div>
            </div>

            <div class="bottomSection">
                <p>HP: <span id="monsterHP"></span></p>
                
                <div class="monsterActionBox">
                    <label>Monster Action:</label> 
                    <label id="monsterActionDisplay"></label>
                </div>
            </div>
        </div>

        <div id="battleLog" class="display">
            <h3>Battle Log</h3>

            <div id="battleLogMessages"></div>
        </div>
    </main>
</body>
</html>
