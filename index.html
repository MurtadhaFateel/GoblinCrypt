<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Vs Monster</title>
    <link rel="stylesheet" href="./css/gamestyle.css">
    <script src="./js/app.js" defer></script>
    <a href="./html/gameInstructions.html">Game Instructions</a>
</head>
<body>
    <main class="container">

        <div id="charcterAction" class="display">
            <h3 id="CharName">Character Name</h3>
            
            <p id="charHP"></p>
            
            <button id="charAttackSkill">
                Attack Skill
            </button>
            
            <button id="charPowerUp">
                Power Up
            </button>
            
            <button id="charPotion">
                Healing Potion
            </button>
        </div>
        
        <div id="monsterAction" class="display">
            <label >Monster Action: </label> <label id="monsterActionDisplay">Place Holder for JS</label>
        </div>

        <div id="battleLog" class="display">
            <h3>Battle Log</h3>
        </div>
    </main>
</body>
</html>
